name: BDD Playwright Tests
on:
  push:
    branches: [ bdd-automation ]
  pull_request:
    branches: [ bdd-automation ]
  schedule:
    - cron: '0 9 * * 1-5'        # runs every weekday at 9:00 AM UTC
  workflow_dispatch:               # manual trigger from GitHub UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run BDD Tests
      run: npx cucumber-js --profile login

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: cucumber-report
        path: reports/
        retention-days: 30

    - name: Notify Slack — Success
      if: success()
      run: |
        curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "✅ BDD Tests Passed!" }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*📁 Repository:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>" },
                  { "type": "mrkdwn", "text": "*🌿 Branch:*\n`${{ github.ref_name }}`" }
                ]
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*👤 Triggered by:*\n${{ github.actor }}" },
                  { "type": "mrkdwn", "text": "*⚡ Trigger type:*\n`${{ github.event_name }}`" }
                ]
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*🔖 Commit SHA:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>" },
                  { "type": "mrkdwn", "text": "*💬 Commit Message:*\n${{ github.event.head_commit.message }}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "🔗 View Actions Run" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              },
              {
                "type": "context",
                "elements": [
                  { "type": "mrkdwn", "text": "GitHub Actions | BDD Automation" }
                ]
              }
            ]
          }'

    - name: Notify Slack — Failure
      if: failure()
      run: |
        curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data '{
            "blocks": [
              {
                "type": "header",
                "text": { "type": "plain_text", "text": "❌ BDD Tests Failed!" }
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*📁 Repository:*\n<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>" },
                  { "type": "mrkdwn", "text": "*🌿 Branch:*\n`${{ github.ref_name }}`" }
                ]
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*👤 Triggered by:*\n${{ github.actor }}" },
                  { "type": "mrkdwn", "text": "*⚡ Trigger type:*\n`${{ github.event_name }}`" }
                ]
              },
              {
                "type": "section",
                "fields": [
                  { "type": "mrkdwn", "text": "*🔖 Commit SHA:*\n<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>" },
                  { "type": "mrkdwn", "text": "*💬 Commit Message:*\n${{ github.event.head_commit.message }}" }
                ]
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "🔗 View Failure Logs" },
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              },
              {
                "type": "context",
                "elements": [
                  { "type": "mrkdwn", "text": "GitHub Actions | BDD Automation" }
                ]
              }
            ]
          }'