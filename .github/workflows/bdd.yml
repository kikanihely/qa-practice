name: BDD Playwright Tests
on:
  push:
    branches: [ bdd-automation ]
  pull_request:
    branches: [ bdd-automation ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run BDD Tests
      run: npx cucumber-js --profile login
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: cucumber-report
        path: reports/
        retention-days: 30

    - name: Notify Slack — Success
      if: success()
      uses: slackapi/slack-github-action@v1.26.0
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        payload: |
          {
            "text": "✅ *BDD Tests Passed!*",
            "attachments": [{
              "color": "good",
              "fields": [
                { "title": "Branch",       "value": "${{ github.ref_name }}", "short": true },
                { "title": "Triggered by", "value": "${{ github.actor }}",    "short": true },
                { "title": "View Run",     "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
              ]
            }]
          }

    - name: Notify Slack — Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.26.0
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        payload: |
          {
            "text": "❌ *BDD Tests Failed!*",
            "attachments": [{
              "color": "danger",
              "fields": [
                { "title": "Branch",       "value": "${{ github.ref_name }}", "short": true },
                { "title": "Triggered by", "value": "${{ github.actor }}",    "short": true },
                { "title": "View Logs",    "value": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}", "short": false }
              ]
            }]
          }