name: BDD Playwright Tests
on:
  push:
    branches: [ bdd-automation ]
  pull_request:
    branches: [ bdd-automation ]
  schedule:
    - cron: '0 9 * * 1-5'        # runs every weekday at 9:00 AM UTC
  workflow_dispatch:               # manual trigger from GitHub UI

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run BDD Tests
      run: npx cucumber-js --profile login

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: cucumber-report
        path: reports/
        retention-days: 30

    - name: Notify Slack — Success
      if: success()
      uses: slackapi/slack-github-action@v1.26.0
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        payload: |
          {
            "text": "✅ *BDD Tests Passed!*",
            "attachments": [{
              "color": "good",
              "fields": [
                {
                  "title": "📁 Repository",
                  "value": "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>",
                  "short": true
                },
                {
                  "title": "🌿 Branch",
                  "value": "${{ github.ref_name }}",
                  "short": true
                },
                {
                  "title": "👤 Triggered by",
                  "value": "${{ github.actor }}",
                  "short": true
                },
                {
                  "title": "⚡ Trigger type",
                  "value": "${{ github.event_name }}",
                  "short": true
                },
                {
                  "title": "🔖 Commit SHA",
                  "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>",
                  "short": false
                },
                {
                  "title": "💬 Commit Message",
                  "value": "${{ github.event.head_commit.message }}",
                  "short": false
                },
                {
                  "title": "🔗 View GitHub Actions Run",
                  "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here to view run>",
                  "short": false
                }
              ],
              "footer": "GitHub Actions | BDD Automation",
              "ts": "${{ github.event.head_commit.timestamp }}"
            }]
          }

    - name: Notify Slack — Failure
      if: failure()
      uses: slackapi/slack-github-action@v1.26.0
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      with:
        payload: |
          {
            "text": "❌ *BDD Tests Failed!*",
            "attachments": [{
              "color": "danger",
              "fields": [
                {
                  "title": "📁 Repository",
                  "value": "<${{ github.server_url }}/${{ github.repository }}|${{ github.repository }}>",
                  "short": true
                },
                {
                  "title": "🌿 Branch",
                  "value": "${{ github.ref_name }}",
                  "short": true
                },
                {
                  "title": "👤 Triggered by",
                  "value": "${{ github.actor }}",
                  "short": true
                },
                {
                  "title": "⚡ Trigger type",
                  "value": "${{ github.event_name }}",
                  "short": true
                },
                {
                  "title": "🔖 Commit SHA",
                  "value": "<${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>",
                  "short": false
                },
                {
                  "title": "💬 Commit Message",
                  "value": "${{ github.event.head_commit.message }}",
                  "short": false
                },
                {
                  "title": "🔗 View Failure Logs",
                  "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Click here to view logs>",
                  "short": false
                }
              ],
              "footer": "GitHub Actions | BDD Automation",
              "ts": "${{ github.event.head_commit.timestamp }}"
            }]
          }