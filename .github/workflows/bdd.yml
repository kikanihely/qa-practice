- name: Notify Slack — Success
      if: success()
      run: |
        cat > /tmp/slack_success.json << 'ENDJSON'
        {
          "blocks": [
            {
              "type": "header",
              "text": { "type": "plain_text", "text": "✅ BDD Tests Passed!" }
            },
            {
              "type": "section",
              "fields": [
                { "type": "mrkdwn", "text": "*📁 Repository:*\n<REPO_URL|REPO_NAME>" },
                { "type": "mrkdwn", "text": "*🌿 Branch:*\nBRANCH_NAME" }
              ]
            },
            {
              "type": "section",
              "fields": [
                { "type": "mrkdwn", "text": "*👤 Triggered by:*\nACTOR_NAME" },
                { "type": "mrkdwn", "text": "*⚡ Trigger type:*\nEVENT_NAME" }
              ]
            },
            {
              "type": "section",
              "fields": [
                { "type": "mrkdwn", "text": "*🔖 Commit SHA:*\n<COMMIT_URL|COMMIT_SHA>" },
                { "type": "mrkdwn", "text": "*💬 Commit Message:*\nCOMMIT_MSG" }
              ]
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": { "type": "plain_text", "text": "🔗 View Actions Run" },
                  "url": "RUN_URL"
                }
              ]
            },
            {
              "type": "context",
              "elements": [
                { "type": "mrkdwn", "text": "GitHub Actions | BDD Automation" }
              ]
            }
          ]
        }
        ENDJSON

        sed -i "s|REPO_URL|${{ github.server_url }}/${{ github.repository }}|g" /tmp/slack_success.json
        sed -i "s|REPO_NAME|${{ github.repository }}|g" /tmp/slack_success.json
        sed -i "s|BRANCH_NAME|${{ github.ref_name }}|g" /tmp/slack_success.json
        sed -i "s|ACTOR_NAME|${{ github.actor }}|g" /tmp/slack_success.json
        sed -i "s|EVENT_NAME|${{ github.event_name }}|g" /tmp/slack_success.json
        sed -i "s|COMMIT_URL|${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|g" /tmp/slack_success.json
        sed -i "s|COMMIT_SHA|${{ github.sha }}|g" /tmp/slack_success.json
        sed -i "s|COMMIT_MSG|${{ github.event.head_commit.message }}|g" /tmp/slack_success.json
        sed -i "s|RUN_URL|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|g" /tmp/slack_success.json

        curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data @/tmp/slack_success.json

    - name: Notify Slack — Failure
      if: failure()
      run: |
        cat > /tmp/slack_failure.json << 'ENDJSON'
        {
          "blocks": [
            {
              "type": "header",
              "text": { "type": "plain_text", "text": "❌ BDD Tests Failed!" }
            },
            {
              "type": "section",
              "fields": [
                { "type": "mrkdwn", "text": "*📁 Repository:*\n<REPO_URL|REPO_NAME>" },
                { "type": "mrkdwn", "text": "*🌿 Branch:*\nBRANCH_NAME" }
              ]
            },
            {
              "type": "section",
              "fields": [
                { "type": "mrkdwn", "text": "*👤 Triggered by:*\nACTOR_NAME" },
                { "type": "mrkdwn", "text": "*⚡ Trigger type:*\nEVENT_NAME" }
              ]
            },
            {
              "type": "section",
              "fields": [
                { "type": "mrkdwn", "text": "*🔖 Commit SHA:*\n<COMMIT_URL|COMMIT_SHA>" },
                { "type": "mrkdwn", "text": "*💬 Commit Message:*\nCOMMIT_MSG" }
              ]
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": { "type": "plain_text", "text": "🔗 View Failure Logs" },
                  "url": "RUN_URL"
                }
              ]
            },
            {
              "type": "context",
              "elements": [
                { "type": "mrkdwn", "text": "GitHub Actions | BDD Automation" }
              ]
            }
          ]
        }
        ENDJSON

        sed -i "s|REPO_URL|${{ github.server_url }}/${{ github.repository }}|g" /tmp/slack_failure.json
        sed -i "s|REPO_NAME|${{ github.repository }}|g" /tmp/slack_failure.json
        sed -i "s|BRANCH_NAME|${{ github.ref_name }}|g" /tmp/slack_failure.json
        sed -i "s|ACTOR_NAME|${{ github.actor }}|g" /tmp/slack_failure.json
        sed -i "s|EVENT_NAME|${{ github.event_name }}|g" /tmp/slack_failure.json
        sed -i "s|COMMIT_URL|${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}|g" /tmp/slack_failure.json
        sed -i "s|COMMIT_SHA|${{ github.sha }}|g" /tmp/slack_failure.json
        sed -i "s|COMMIT_MSG|${{ github.event.head_commit.message }}|g" /tmp/slack_failure.json
        sed -i "s|RUN_URL|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|g" /tmp/slack_failure.json

        curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
          -H 'Content-type: application/json' \
          --data @/tmp/slack_failure.json